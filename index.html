<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitly</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <h1 class="logo">Habitly
                </h1>
                <p class="date">Monday, November 16</p>
            </div>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
        </header>
        <main> 
            <section class="quote-card">
                <blockquote id="quoteText">Loading...</blockquote>
                <p id="quoteAuthor"></p>
            </section>
            <section class="stats">
                <div class="stat-card">
                    <span class="stat-value" id="doneToday">3/5</span>
                    <span class="stat-label">Done today</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">12 days</span>
                    <span class="stat-label">Best streak</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">78%</span>
                    <span class="stat-label">This week</span>
                </div>
            </section>
            <section class="add-habit">
                <h2>Add a habit</h2>
                <form id="addForm">
                    <input type="text" id="habitInput" placeholder="e.g. Stretch for 10 minutes" maxlength="40">
                    <button type="submit" class="add-btn">Add habit</button>
                </form>
                <div class="emogi-picker" id="emojiPicker">
                    <button type="button" class="emoji-option selected" data-emoji="💧">💧</button>
                    <button type="button" class="emoji-option" data-emoji="📚">📚</button>
                    <button type="button" class="emoji-option" data-emoji="🏃">🏃</button>
                    <button type="button" class="emoji-option" data-emoji="🧘">🧘</button>
                    <button type="button" class="emoji-option" data-emoji="💻">💻</button>
                    <button type="button" class="emoji-option" data-emoji="🥗">🥗</button>
                </div>
                <p id="formMessage"></p>
            </section>
            <section class="habits">
                <ul class="habit-list" id="habitList">
                </ul>
            </section>
        </main>
        <footer class="footer">
            <p>Built with CodGen Frontend Internship | <a href="https://codgen.in" target="_blank" rel="noopener">codgen.in</a></p>
        </footer>
</body>
    <script src="app.js" defer></script>
</html>
